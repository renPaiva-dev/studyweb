# Sobrescreve, so para o profile "test" (usado por testes @DataJpaTest com H2
# em memoria), as propriedades de JPA/Hibernate que no application.properties
# principal assumem PostgreSQL.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# As migrations em db/migration sao escritas para Postgres (ver
# V1__criar_schema_inicial.sql) e o schema dos testes @DataJpaTest e gerado
# direto pelo Hibernate (create-drop) a partir das entidades - sem isso, o
# Flyway tentaria aplicar essa mesma migration no H2 em memoria a cada teste.
spring.flyway.enabled=false

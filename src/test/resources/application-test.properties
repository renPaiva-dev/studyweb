# Sobrescreve, so para o profile "test", as propriedades de banco/JPA que no
# application.properties principal assumem PostgreSQL. Usado tanto por testes
# @DataJpaTest (que substituem o datasource por H2 automaticamente, via
# @AutoConfigureTestDatabase) quanto por PlataformaEstudosApplicationTests
# (@SpringBootTest simples, que NAO substitui o datasource sozinho - sem estas
# linhas ele tentaria conectar no Postgres real do application.properties).
spring.datasource.url=jdbc:h2:mem:studyweb-test;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# As migrations em db/migration sao escritas para Postgres (ver
# V1__criar_schema_inicial.sql) e o schema dos testes @DataJpaTest e gerado
# direto pelo Hibernate (create-drop) a partir das entidades - sem isso, o
# Flyway tentaria aplicar essa mesma migration no H2 em memoria a cada teste.
spring.flyway.enabled=false

# --- Valores "fake" so para os @Value sem default resolverem quando um teste
# sobe o contexto completo (PlataformaEstudosApplicationTests,
# SeedDemoDataRunnerTest). Este arquivo precisa ser autossuficiente: ao
# contrario do application.properties principal (nunca commitado - so existe
# na maquina de quem desenvolve), este e versionado e e o unico que o CI
# enxerga, entao nao pode depender de nenhum valor vindo de la nem de
# variavel de ambiente do SO. Sem isso, qualquer teste que suba o contexto
# inteiro falha com "Could not resolve placeholder" fora da maquina de
# desenvolvimento (so nunca foi pego porque nao havia CI ate agora). ---
jwt.secret=chave-secreta-de-teste-com-pelo-menos-32-caracteres
jwt.expiration-ms=3600000
gemini.api.key=chave-fake-de-teste
gemini.api.url=https://gemini.invalid/test
app.frontend-url=http://localhost:5173
app.cors.allowed-origins=http://localhost:5173
app.upload.dir=${java.io.tmpdir}/studyweb-test-uploads
app.termos.versao-atual=1.0

# Profile ativado no container (SPRING_PROFILES_ACTIVE=docker, ver
# docker-compose.yml). Diferente de application.properties (nunca commitado
# — contém segredos locais reais), este arquivo é versionado e não tem
# nenhum segredo real: tudo que é sensível fica sem valor de fallback,
# exigido via variável de ambiente do .env do docker-compose (ver
# .env.example). Sem eles definidos, o SegredosStartupValidator avisa alto
# no log, mas a aplicação sobe mesmo assim.
spring.application.name=studyweb

# --- Porta HTTP: Railway (e PaaS em geral) injeta PORT e espera o app
# escutar nela; sem PORT definido (docker-compose local), cai no 8080 de
# sempre (ver Dockerfile EXPOSE 8080 e docker-compose.yml). ---
server.port=${PORT:8080}

# --- PostgreSQL: default aponta pro "db" do docker-compose local (rede
# interna do compose, não localhost). Em outro ambiente (ex.: Railway, cujo
# plugin de Postgres expõe host/porta/banco próprios via PGHOST/PGPORT/
# PGDATABASE), sobrescreva SPRING_DATASOURCE_URL/DB_USERNAME/DB_PASSWORD —
# ver Docs/deploy-railway.md. ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/plataformaestudos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- CORS ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Rate limiting (B13) --- so' true quando o backend estiver de fato atras
# de um proxy reverso/CDN confiavel que sobrescreve X-Forwarded-For (nunca
# repassa o valor do cliente original) - sem isso, confiar no header permite
# burlar o limite por completo. Sem proxy na frente (cenario atual deste
# docker-compose.yml), manter false.
app.rate-limit.confiar-x-forwarded-for=${RATE_LIMIT_CONFIAR_X_FORWARDED_FOR:false}

# --- URL publica do frontend (links clicaveis nos e-mails de
# verificacao/redefinicao de senha) ---
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# --- JWT (UC01 / RNF03) ---
jwt.secret=${JWT_SECRET:troque-este-valor-por-um-segredo-aleatorio-de-32-chars}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# --- Upload de material (UC03 / RN06: máximo 15MB) ---
app.upload.dir=${APP_UPLOAD_DIR:/app/uploads}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

# --- Integração com IA (Gemini) — sem fallback real de propósito ---
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent

# --- E-mail (UC18/RN24) — sem MAIL_HOST, EmailService cai no fallback de log ---
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- LGPD (UC23/RN30) ---
app.termos.versao-atual=1.0

# --- Dados de demonstração (banca@studyweb.local) --- opt-in via env, nunca
# habilitado por padrão em nenhum deploy (ver SeedDemoDataRunner). Rodar só
# pouco antes da apresentação, com a conta demo ainda inexistente, para as
# datas relativas (streak, evolução) ficarem "frescas".
app.seed-demo.enabled=${SEED_DEMO_ENABLED:false}

# --- Lembrete de revisão pendente (UC30/RN39) — cron padrão: todo dia às 8h ---
app.lembrete-revisao.cron=${LEMBRETE_REVISAO_CRON:0 0 8 * * *}

# --- Limpeza de contas não verificadas (UC21/RN26) — cron padrão: a cada 5min ---
app.limpeza-contas-nao-verificadas.cron=${LIMPEZA_CONTAS_NAO_VERIFICADAS_CRON:0 */5 * * * *}
